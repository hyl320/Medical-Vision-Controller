name: CMake Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build VisionApp on Windows
    runs-on: windows-2022

    defaults:
      run:
        working-directory: 313_part1

    env:
      BUILD_DIR: build/ci
      OPENCV_VERSION: 4.10.0
      OPENCV_DIR: ${{ github.workspace }}/313_part1/third_party/opencv/build
      ONNXRUNTIME_VERSION: 1.18.1
      ONNXRUNTIME_DIR: ${{ github.workspace }}/313_part1/third_party/onnxruntime-win-x64-1.18.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          choco install ninja --yes

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: 313_part1/third_party/opencv
          key: opencv-windows-${{ env.OPENCV_VERSION }}

      - name: Download OpenCV
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/opencv/build/OpenCVConfig.cmake")) {
            New-Item -ItemType Directory -Force -Path third_party | Out-Null
            $installer = "opencv-${env:OPENCV_VERSION}-windows.exe"
            $url = "https://github.com/opencv/opencv/releases/download/${env:OPENCV_VERSION}/$installer"
            curl.exe -L --retry 5 --retry-delay 10 --output "third_party/$installer" $url
            Start-Process -FilePath "third_party/$installer" -ArgumentList "-o`"$PWD/third_party`" -y" -Wait -NoNewWindow
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: 313_part1/third_party/onnxruntime-win-x64-1.18.1
          key: onnxruntime-windows-${{ env.ONNXRUNTIME_VERSION }}

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ONNXRUNTIME_DIR}/include/onnxruntime_cxx_api.h")) {
            New-Item -ItemType Directory -Force -Path third_party | Out-Null
            $archive = "onnxruntime-win-x64-${env:ONNXRUNTIME_VERSION}.zip"
            $url = "https://github.com/microsoft/onnxruntime/releases/download/v${env:ONNXRUNTIME_VERSION}/$archive"
            curl.exe -L --retry 5 --retry-delay 10 --output "third_party/$archive" $url
            Expand-Archive -Path "third_party/$archive" -DestinationPath third_party -Force
          }

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B ${{ env.BUILD_DIR }}
          -G Ninja
          -D CMAKE_BUILD_TYPE=Release
          -D CMAKE_C_COMPILER=cl
          -D CMAKE_CXX_COMPILER=cl
          -D OpenCV_DIR="${{ env.OPENCV_DIR }}"
          -D ONNXRUNTIME_DIR="${{ env.ONNXRUNTIME_DIR }}"

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release

      - name: Prepare portable application package
        shell: pwsh
        run: |
          $package = "build/package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "${env:BUILD_DIR}/VisionApp.exe" $package -Force
          Copy-Item "${env:BUILD_DIR}/*.dll" $package -Force
          Copy-Item "config.json" $package -Force
          New-Item -ItemType Directory -Force -Path "$package/models" | Out-Null
          Copy-Item "models/best.onnx" "$package/models" -Force
          windeployqt `
            --release `
            --no-translations `
            --compiler-runtime `
            --dir $package `
            "$package/VisionApp.exe"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionApp-windows
          path: 313_part1/build/package
          if-no-files-found: error
